services:
  web:
    image: node:20
    container_name: fantazi-land-web
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    command: sh -c "npm ci && npx prisma generate && npx next dev -H 0.0.0.0 -p 3000"
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX:-preview.example}
      - WATCHPACK_POLLING=true
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

volumes:
  node_modules:
